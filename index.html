<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="heading">
            <div class="main">Weather Information </div>
            <div class="description">Get the latest weather updates for your location</div>
        </div>
        <div class="input">
            <input id="location" value="ambala" placeholder="Enter your city">
            <button id="btn" >Get Weather</button>
        </div>
        <div class="info">
            <div class="output" id="temp">Feels like</div>
            <div class="output" id="wind">Wind Speed</div>
            <div class="output" id="humid">Humidity</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
